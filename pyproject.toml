[project]
name = "ojk-regulatory-assistant"
version = "0.1.0"
description = "OJK/BI Regulatory Intelligence Assistant — RAG-based Q&A over Indonesian banking regulations (LLM Zoomcamp 2026 Final Project)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "openai>=1.50",
    "dlt>=1.0",
    "psycopg2-binary>=2.9",
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
