services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: rag-grafana
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Grafana di balik HTTPS LB path routing (/grafana) butuh root_url + subpath.
      # Default = local dev (localhost:3000, tanpa subpath).
      # Untuk production, set di .env:
      #   GRAFANA_ROOT_URL=https://banking-comp-assistant.rezkyaulia.dev/grafana/
      #   GRAFANA_SERVE_FROM_SUB_PATH=true
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      pgvector:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # In-container networking: 'localhost' in .env refers to the container
      # itself, so override DATABASE_URL with the pgvector service hostname.
      POSTGRES_HOST: pgvector
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-change_me}@pgvector:5432/${POSTGRES_DB:-rag_db}
    volumes:
      - ./data:/app/data
      - ./nyawa:/app/nyawa:ro
      # nyawa v1.0.0 hardcodes /opt/data/nyawa/internal/embedder for its BGE
      # embedder (bge_server.py + ONNX model) — mounted from ./nyawa/bge/
      - ./nyawa/bge:/opt/data/nyawa/internal/embedder:ro
    depends_on:
      pgvector:
        condition: service_healthy
    # Behind HTTPS LB: CORS/XSRF dimatikan karena Origin/Host berbeda di proxy.
    # enableCORS=false + enableXsrfProtection=false = rekomendasi resmi Streamlit
    # untuk deploy di belakang reverse proxy / load balancer.
    command: ["streamlit", "run", "app/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.enableCORS=false", "--server.enableXsrfProtection=false"]

volumes:
  pgvector_data:
  grafana_data:
