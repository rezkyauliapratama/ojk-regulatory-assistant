services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ojk-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ojk_regulatory}
      POSTGRES_USER: ${POSTGRES_USER:-ojk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ojk} -d ${POSTGRES_DB:-ojk_regulatory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: ojk-grafana
    container_name: ojk-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-ojk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ojk_regulatory}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      pgvector:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ojk-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: pgvector
    volumes:
      - ./data:/app/data
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["streamlit", "run", "app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  pgvector_data:
  grafana_data:
