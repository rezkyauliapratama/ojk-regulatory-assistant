services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: rag-grafana
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      pgvector:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # In-container networking: 'localhost' in .env refers to the container
      # itself, so override DATABASE_URL with the pgvector service hostname.
      POSTGRES_HOST: pgvector
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-change_me}@pgvector:5432/${POSTGRES_DB:-rag_db}
    volumes:
      - ./data:/app/data
      - ./nyawa:/app/nyawa:ro
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["streamlit", "run", "app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  pgvector_data:
  grafana_data:
